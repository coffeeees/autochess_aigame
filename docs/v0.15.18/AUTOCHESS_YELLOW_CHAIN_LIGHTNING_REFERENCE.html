<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTOCHESS Yellow Chain Lightning VFX Reference</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0c1221;color:#edf1fb;font:14px system-ui,sans-serif;display:grid;place-items:center;padding:24px}.wrap{width:min(960px,100%)}h1{font-size:20px;margin:0 0 8px}p{color:#a7b7ca;margin:0 0 14px}.stage{position:relative;border:1px solid #3b516d;border-radius:12px;overflow:hidden;background:#0d172c}canvas{display:block;width:100%;height:360px}#phase{position:absolute;bottom:14px;left:14px;background:#101826d9;color:#ffe2a2;padding:7px 12px;border-radius:6px}button{background:#34302c;color:#ffe2a2;border:1px solid #847247;border-radius:8px;padding:9px 16px;cursor:pointer}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;flex-wrap:wrap;color:#aabbd3}
</style></head><body><main class="wrap"><h1>오토체스 — 노란 전기 연쇄 VFX</h1><p>시연용 Canvas 레퍼런스. 회색 일반 탄환 + 노란 발사 스파클 + 첫 명중 전기 폭발 + 주변 2명 연쇄.</p><div class="stage"><canvas id="stage"></canvas><div id="phase">발사 준비</div></div><footer><span>실제 게임에서는 각 유닛 위치 및 판정 이벤트에 연결하세요.</span><button id="replay">↻ 다시 재생</button></footer></main><script>
(()=>{const cv=document.querySelector('#stage'),ctx=cv.getContext('2d'),label=document.querySelector('#phase');const TOTAL=2350;let start=performance.now();const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const ease=v=>{v=clamp(v);return v*v*(3-2*v)};const rnd=n=>{const z=Math.sin(n*128.173+37.3)*43758.5453;return z-Math.floor(z)};
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function glow(x,y,r,p=1){if(p<=0)return;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(255,251,181,${.72*p})`);g.addColorStop(.18,`rgba(255,210,58,${.49*p})`);g.addColorStop(.5,`rgba(255,151,27,${.21*p})`);g.addColorStop(1,'rgba(244,105,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
const colors=['#fffbe2','#fff093','#ffd44e','#ffad29','#ffeb7e'];
function burst(x,y,t,at,count,maxDist,seed){const age=t-at,life=410;if(age<0||age>life)return;const f=age/life;for(let i=0;i<count;i++){const death=.43+rnd(i*13+seed)*.57;if(f>death)continue;const angle=i*2.39996+rnd(seed+i*17)*.9;const dist=(5+maxDist*f)*(.35+rnd(i*9+seed)*.67);const px=x+Math.cos(angle)*dist,py=y+Math.sin(angle)*dist*.82;const sz=2+Math.floor(rnd(i*23+seed)*3)*1.5;glow(px,py,sz*4.5,.45);rect(px,py,sz,sz,colors[(i+seed)%colors.length])}}
function target(p,t,hit){const age=t-hit,hot=age>=0&&age<360,amp=hot?1-ease(age/360):0;glow(p.x,p.y,hot?38:21,hot?amp*.8:.11);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.PI/4);rect(-12,-12,24,24,'#8e9cb1');rect(-9,-9,18,18,'#263148');rect(-6,-6,12,12,hot?'#f8d654':'#a83b51');rect(-3,-3,6,6,hot?'#fff8d0':'#ed7181');ctx.restore();if(hot){ctx.beginPath();ctx.arc(p.x,p.y,13+age*.07,0,Math.PI*2);ctx.strokeStyle=`rgba(255,215,103,${.8*amp})`;ctx.lineWidth=2;ctx.stroke()}}
function zigzag(a,b,t,begin,seed){const age=t-begin;if(age<0||age>400)return;const strength=clamp(age/85)*(1-ease((age-260)/140));if(strength<=0)return;const dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1;const nx=-dy/length,ny=dx/length;const phase=Math.floor(age/42),pts=[a];for(let i=1;i<13;i++){const f=i/13;const jitter=(rnd(i*39+phase*71+seed*121)-.5)*18*Math.sin(Math.PI*f);pts.push({x:a.x+dx*f+nx*jitter,y:a.y+dy*f+ny*jitter})}pts.push(b);ctx.save();ctx.globalAlpha=strength;ctx.lineJoin='miter';ctx.lineCap='square';for(const [width,color,blur] of [[12,'#b65b00',22],[7,'#ffb622',12],[3,'#fff5a9',3]]){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.shadowColor='#ffc737';ctx.shadowBlur=blur;ctx.stroke()}ctx.shadowBlur=0;for(let i=2;i<12;i+=3){const p=pts[i];rect(p.x-2,p.y-2,4,4,'#fff8d1');const side=i%2?1:-1;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+nx*side*14+dx/length*6,p.y+ny*side*14+dy/length*6);ctx.strokeStyle='#ffdc6a';ctx.lineWidth=2;ctx.stroke()}ctx.restore()}
function frame(now){const box=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(box.width*d)||cv.height!==Math.round(box.height*d)){cv.width=Math.round(box.width*d);cv.height=Math.round(box.height*d)}const W=box.width,H=box.height,t=(now-start)%TOTAL;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101c34');bg.addColorStop(1,'#0d1628');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.lineWidth=1;ctx.strokeStyle='rgba(119,143,199,.07)';for(let x=12;x<W;x+=28){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=12;y<H;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}const shooter={x:W*.09,y:H*.50},main={x:W*.55,y:H*.50},upper={x:W*.81,y:H*.24},lower={x:W*.81,y:H*.77};target(main,t,730);target(upper,t,1110);target(lower,t,1220);burst(shooter.x,shooter.y,t,60,19,47,4);if(t>=60&&t<360){const age=t-60,f=age/300;glow(shooter.x,shooter.y,47+f*21,(1-ease(f))*.9);ctx.save();ctx.globalAlpha=1-ease(f);for(let i=0;i<7;i++){const angle=i*2.39996,r1=8+f*14,r2=21+f*30;ctx.beginPath();ctx.moveTo(shooter.x+Math.cos(angle)*r1,shooter.y+Math.sin(angle)*r1);ctx.lineTo(shooter.x+Math.cos(angle+.24)*r2,shooter.y+Math.sin(angle+.24)*r2);ctx.lineWidth=i%2?2:3;ctx.strokeStyle=colors[i%colors.length];ctx.stroke()}ctx.restore()}if(t>=100&&t<730){const x=shooter.x+(main.x-shooter.x)*((t-100)/630);rect(x-15,shooter.y-4,31,8,'#aab2c0');rect(x-12,shooter.y-2,25,4,'#eff3fa');for(let i=0;i<3;i++)rect(x-23-i*8,shooter.y+(i%2?3:-2),3,3,'#858fa0')}burst(main.x,main.y,t,730,32,76,9);if(t>=730&&t<1030){const f=(t-730)/300;glow(main.x,main.y,70+f*25,(1-ease(f)))}zigzag(main,upper,t,930,8);zigzag(main,lower,t,1030,12);burst(upper.x,upper.y,t,1110,23,68,21);burst(lower.x,lower.y,t,1220,23,68,31);if(t>=900&&t<1450){const amp=1-ease((t-950)/500);glow(main.x,main.y,52,amp*.8)}label.textContent=t<730?'① 노란 발사 스파크 + 회색 일반 탄환':t<930?'② 최초 명중 · 노란 전기 폭발':t<1500?'③ 주변 2명에게 노란 번개 연쇄':'④ 파티클 개수 감소 후 소멸';requestAnimationFrame(frame)}document.querySelector('#replay').addEventListener('click',()=>{start=performance.now()});requestAnimationFrame(frame)})();
</script></body></html>
